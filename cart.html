<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart</title>
<style>
body { font-family: Arial; }
.item {
    border:1px solid black;
    padding:10px;
    margin:10px;
}
button {
    margin:5px;
    padding:8px;
    cursor:pointer;
}
.buy { background-color: green; color:white; }
.remove { background-color: red; color:white; }
</style>
</head>
<body>

<h1>Your Cart 🛒</h1>
<div id="cart-items"></div>

<button onclick="buyAll()">Buy All</button>

<script>
function loadCart() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cart-items");

    container.innerHTML = "";

    if (cart.length === 0) {
        container.innerHTML = "<h2>Cart is empty</h2>";
        return;
    }

    cart.forEach((item, index) => {
        container.innerHTML += `
        <div class="item">
            <img src="${item.productImage}" width="100">
            <h3>${item.productName}</h3>
            <p>Price: $${item.productPrice}</p>

            <button class="remove" onclick="removeItem(${index})">Remove</button>
            <button class="buy" onclick="buyItem(${index})">Buy Now</button>
        </div>
        `;
    });
}

function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

function buyItem(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let product = cart[index];

    localStorage.setItem("buyProduct", JSON.stringify(product));

}

function buyAll() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        alert("Cart is empty!");
        return;
    }

    localStorage.setItem("buyProduct", JSON.stringify(cart));

    let isLoggedIn = localStorage.getItem("userLoggedIn");

    if (!isLoggedIn) {
        alert("Please login first!");
        window.location.href = "login.html";
    } else {
        window.location.href = "buy.html";
    }
}

window.onload = loadCart;
</script>

</body>
</html>
