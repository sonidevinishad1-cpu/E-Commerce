<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        body
        {
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .main
        {
            width:400px;
            height:520px;
            margin-top:40px;
            border-radius:10px;
            background:rgba(255, 255, 255, 0.15);
            backdrop-filter:blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow:0px 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1
        {
            color:black;
            margin-left:150px;
        }
        label
        {
            color:black;
            margin-left:40px;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        input[type="text"]
        {
            height:25px;
            width:300px;
            margin-left:40px;
            outline:none;
            border-radius:2px;
            border:1px solid rgba(255, 255, 255, 0.3);
            background-color:whitesmoke;
        }
        input[type="password"]
        {
            height:25px;
            width:300px;
            margin-left:40px;
            outline:none;
            border-radius:2px;
            border:1px solid rgba(255, 255, 255, 0.3);
            background-color:whitesmoke;
        }
        input[type="submit"]
        {
            height:40px;
            width:310px;
            margin-left:40px;
            border-radius:5px;
            cursor:pointer;
            background-color:rgb(82, 82, 245);
            border:1px solid rgb(82, 82, 245);
        }
        input[type="submit"]:hover
        {
            background-color:rgb(101, 101, 247);
        }
        .forget
        {
            display:flex;
            justify-content:flex-end;
            position: absolute;
            margin-left:40px;
            top:-50px;
            width:310px;
        }
        a{
            position: absolute;
            top:260px;
            text-decoration:none;
        }
        a:hover
        {
            text-decoration:underline;
        }
        .see
        {
            width:28px;
            height:22px;
            position: absolute;
            transition:all ease 0.3s;
        }
    </style>
</head>
<body>
    <img src="nature.jpeg" alt="" style="position:absolute; width:100%; height:109.6vh;">
    <div class="main">
        <h1>Login</h1>
        <form onsubmit="return check()">
            <label for="">Username</label><br>
            <input type="text" placeholder="Username" id="user"><br><br>
            <label for="">Password</label>
            <input type="password" placeholder="Password" id="pass">
            <input type="checkbox" class="see" onclick="pass.type=this.checked ? 'text' : 'password'"><br><br><br><br>
            <div class="forget">
            <a href="#">Forget password?</a>
            </div>
            <input type="submit" value="Login" onclick="error()"><br><br>
        </form>
    </div>
</body>
</html>
<script>
    function check()
    {
    let username = document.getElementById("user")
    let password = document.getElementById("pass")
    let valid = true;
    username.style.border="";
    password.style.border="";
    if(username.value==="")
{
    username.style.border="1px solid red";
    alert("Please Fill the Username")
    valid = false;
}
else
{
    username.style.border="1px solid green";
}
if(password.value==="")
{
    password.style.border="1px solid red";
    alert("Please Fill the Password")
    valid = false;
}
else
{
    password.style.border="1px solid green"
}
return valid;
}

</script>
